<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Village Card Engine - Tabletop Kinematics</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }
      body {
        background-color: #1e1e24;
        color: #e0e0e0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      #hud {
        height: 52px;
        background: #141419;
        border-bottom: 1px solid #2d2d38;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        z-index: 100;
      }
      .hud-section {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .title {
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.5px;
        color: #f5f5f5;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .title-tag {
        font-size: 10px;
        background: #3b82f6;
        color: #ffffff;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 600;
      }
      .btn-group {
        display: flex;
        background: #23232c;
        border-radius: 6px;
        padding: 2px;
        gap: 2px;
      }
      .btn {
        background: transparent;
        border: none;
        color: #9e9eb0;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn:hover {
        color: #ffffff;
        background: #32323f;
      }
      .btn.active {
        background: #3b82f6;
        color: #ffffff;
      }
      .action-btn {
        background: #2a2a36;
        border: 1px solid #3d3d4e;
        color: #e2e8f0;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .action-btn:hover {
        background: #383849;
        border-color: #55556d;
      }
      .stat-badge {
        font-size: 12px;
        color: #a0a0b2;
        background: #23232c;
        padding: 5px 10px;
        border-radius: 6px;
        font-family: monospace;
      }
      #viewport-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        background: radial-gradient(circle at center, #252830 0%, #17181c 100%);
      }
      #canvas-wrapper {
        width: 100%;
        height: 100%;
      }
      #footer-hint {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(18, 18, 24, 0.85);
        backdrop-filter: blur(6px);
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 11px;
        color: #94a3b8;
        border: 1px solid rgba(255, 255, 255, 0.08);
        pointer-events: none;
      }
      #sell-zone {
        position: absolute;
        bottom: 20px;
        right: 20px;
        width: 110px;
        height: 110px;
        background: rgba(245, 127, 23, 0.12);
        border: 2px dashed #f57f17;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        color: #fbc02d;
        text-align: center;
        pointer-events: all;
        transition: all 0.2s ease;
      }
      #sell-zone:hover {
        background: rgba(245, 127, 23, 0.25);
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <header id="hud">
      <div class="hud-section">
        <div class="title">
          Village Card Engine
          <span class="title-tag">Phase 5</span>
        </div>
        <div class="stat-badge" id="moon-timer">🌙 Moon 1 (2:00)</div>
        <div class="stat-badge" id="food-status">🥗 Food: 0/1</div>
        <div class="btn-group" id="time-controls">
          <button class="btn" data-speed="0">⏸ 0×</button>
          <button class="btn active" data-speed="1">1×</button>
          <button class="btn" data-speed="2">2×</button>
          <button class="btn" data-speed="5">5×</button>
        </div>
        <button class="action-btn" id="lang-toggle">🌐 EN</button>
        <button class="action-btn" id="btn-hud-dev" style="background: #312e81; border-color: #6366f1; color: #e0e7ff;">🛠️ Dev (F1)</button>
        <button class="action-btn" id="btn-hud-save">💾 Save</button>
        <button class="action-btn" id="btn-hud-load">📂 Load</button>
      </div>

      <div class="hud-section">
        <button class="action-btn" id="spawn-worker">+ Villager</button>
        <button class="action-btn" id="spawn-mob">⚔️ + Goblin</button>
        <button class="action-btn" id="spawn-bush">+ Bush</button>
        <button class="action-btn" id="spawn-resource">+ Wood</button>
        <button class="action-btn" id="spawn-food">+ Berry</button>
        <button class="action-btn" id="spawn-pack">📦 + Pack</button>
        <button class="action-btn" id="spawn-spiral">✨ Spawn 8</button>
        <div class="stat-badge" id="card-counter">Cards: 0 / 20</div>
      </div>
    </header>

    <main id="viewport-container">
      <div id="canvas-wrapper"></div>
      <div id="sell-zone">💰 Drop to Sell</div>
      <div id="footer-hint">
        💡 F1: Dev Tools | F2: +5 Gold | Shift+C: Clone Stack | F5/F9: Save/Load | F6: Schemas
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
